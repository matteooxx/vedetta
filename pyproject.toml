[project]
name = "vedetta"
version = "0.1.0"
description = "A self-hosted monitor for employers' own job boards, with a daily digest"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "PyYAML>=6.0"]

[project.scripts]
vedetta = "vedetta.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vedetta*"]
