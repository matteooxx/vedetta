# Your profile: what you can actually take on.
#
# This is the file that decides whether a posting is WORKABLE for you. It is kept
# separate from rules.yaml on purpose: rules describe how to spot something in a
# posting's text, this describes you.
#
# ---------------------------------------------------------------------------
# NOTHING IS EVER DELETED.
#
# A posting excluded by this profile is counted, explained, and one click away. The
# default view hides them so the list is usable; the number is always on screen so
# you know what you are not looking at.
#
# That distinction is the whole design. A filter that drops a posting quietly fails
# with no trace - nothing ever tells you it happened. A fold with a visible count
# does not.
# ---------------------------------------------------------------------------

identity:
  # Used in explanations and by the language gate in rules.yaml.
  languages: [english]

experience:
  years: 1                   # roughly what you have
  max_years_requested: 2     # a posting asking for more gets flagged

  # Matched against the posting TITLE, word by word.
  accept_level: [graduate, entry, associate, junior, intern, trainee]
  # Matched word by word against the title. "Distinguished", "Fellow" and "Expert"
  # are here because a first run let "Distinguished Engineer" through as workable.
  reject_level: [senior, snr, sr, staff, principal, distinguished, fellow, expert,
                 lead, director, head, chief, vp, president, manager, iii, iv]

locations:
  # A posting usually lists several locations, written half a dozen ways:
  # "Remote, Canada; Remote, United Kingdom", "United States (Remote)",
  # "GB-London", "Home Based - APAC; Home based - EMEA", "2 Locations". Each is
  # judged and the BEST verdict wins, because one workable office makes the posting
  # workable. Within ONE location the most SPECIFIC rule wins instead - see the note
  # on regions below.
  #
  # Four ways a rule can match, and the first two need no explanation:
  #
  #   1. the name as written, case-insensitive substring: "Ireland" catches
  #      "Dublin, Ireland" and "Remote - Ireland".
  #   2. the same country spelled another way. "United States" also catches "USA",
  #      "US" and "Etats-Unis d'Amerique", so you write the country once.
  #   3. a country worked out from a city or a state, where the posting names no
  #      country at all - "San Francisco, California" is in the United States. The
  #      label says so: "outside where you can work (United States, inferred from
  #      San Francisco)". Cities whose name belongs to more than one country -
  #      London, Birmingham, Cambridge, Perth - are never resolved this way. Name
  #      them here yourself if they matter to you.
  #   4. a REGION, below.
  #
  # ---------------------------------------------------------------- regions
  #
  # Any of these can be written instead of a country, and stands for the countries
  # in it:
  #
  #   legal     EU (27)  EEA  Schengen
  #   continent Europe  North America  South America  Americas  Asia
  #             Middle East  Africa  Oceania
  #
  # `EU` is worth doing even if you plan to list countries by hand, because it
  # includes the ones you would forget. The list this file replaced named
  # thirty-nine countries and still missed Greece, Hungary and Bulgaria, which
  # therefore arrived as "location unclear" and counted as workable.
  #
  # Pick the one that matches your situation rather than the one that reads best.
  # For an EU citizen the boundary is legal: `EU` or `EEA`, not `Europe`, because
  # Europe includes the United Kingdom and Switzerland, where you would need
  # sponsorship. Those two belong under `conditional`, by name.
  #
  # A SPECIFIC RULE BEATS A REGION. With `EU` acceptable and `United Kingdom`
  # conditional, a London posting reads conditional. Without that the broad rule
  # would erase the visa warning on the narrow one, and you would apply for a job
  # needing sponsorship without knowing it.
  #
  # Postings also use regions, and there the verdict is DERIVED rather than
  # configured: a region is worth the best verdict among the countries in it. A role
  # advertised for all of EMEA can be done from Milan, so it reads acceptable; APAC
  # contains nothing acceptable to you, so it reads excluded. One thing a region can
  # never do is reach `preferred`: a worldwide-remote role is not IN Dublin, it
  # merely allows it.

  preferred: [Dublin, Ireland]

  acceptable:
    - Remote EU
    - Netherlands
    - Amsterdam
    - Germany
    - Berlin
    - Munich
    - France
    - Paris
    - Spain
    - Barcelona
    - Madrid
    - Portugal
    - Lisbon
    - Luxembourg
    - Belgium
    - Brussels
    - Italy
    - Milan
    - Rome
    - Austria
    - Vienna
    - Poland
    - Warsaw
    - Krakow
    - Sweden
    - Stockholm
    - Denmark
    - Copenhagen
    - Estonia
    - Tallinn
    - Lithuania
    - Vilnius
    - Finland
    - Helsinki
    - Czech
    - Prague
    - Romania
    - Bucharest

  # Workable only if the employer covers sponsorship. Flagged, not excluded.
  conditional:
    - United Kingdom
    - London
    - Manchester
    - Edinburgh
    - Switzerland
    - Zurich
    - Norway
    - Oslo

  # Not workable. Still counted and still one click away.
  excluded:
    - United States
    - Canada
    - Mexico
    - Brazil
    - Argentina
    - India
    - Bangalore
    - Hyderabad
    - Pune
    - Singapore
    - Japan
    - Tokyo
    - China
    - Shanghai
    - Beijing
    - Hong Kong
    - Australia
    - Sydney
    - Melbourne
    - New Zealand
    - Israel
    - Tel Aviv
    - South Africa
    - Nigeria
    - Kenya
    - Egypt
    - Turkey
    - Philippines
    - Manila
    - Indonesia
    - Jakarta
    - Vietnam
    - Thailand
    - Korea
    - Taiwan
    - Costa Rica
    - Colombia
    - Chile
    - Peru

  # "Remote" with no country attached: treat as workable, and say so rather than
  # guessing a country.
  remote_counts_as_acceptable: true

skills:
  # Technologies and practices you can honestly claim. Vedetta compares each posting
  # against this list and shows which of ITS terms are missing from yours.
  #
  # It only ever SHOWS the difference. There is no score and no verdict: whether a
  # gap matters is a judgement about your own experience, and a program guessing at
  # that would be worse than useless - it would be confidently wrong in writing.
  #
  # Matching is case-insensitive and whole-word, so "AWS" catches "AWS Lambda" but
  # "Java" does not catch "JavaScript".
  have:
    - Linux
    - Docker
    - Kubernetes
    - Terraform
    - AWS
    - Azure
    - CI/CD
    - GitLab
    - GitHub Actions
    - Python
    - Bash
    - Git
    - Grafana
    - Prometheus
    - Ansible
    - SQL
    - REST
    - Networking
    - Monitoring
    - Observability

  # Terms worth noticing in a posting even if they are not on your list. Keep this
  # short: the point is a handful of decisive technologies, not a tag cloud.
  watch:
    - OpenShift
    - Helm
    - ArgoCD
    - Jenkins
    - Elasticsearch
    - Kafka
    - Snowflake
    - Databricks
    - Go
    - Rust
    - Java
    - TypeScript
    - React
    - PostgreSQL
    - MongoDB
    - Redis
    - Datadog
    - Splunk
    - Dynatrace
    - Pulumi
    - GCP
    - Serverless
    - Microservices

tracks:
  # Require a positive match from the `cluster` rules in rules.yaml. Without this,
  # every recruiter, designer and finance role on a 400-posting board counts as
  # workable, because none of them trips a gate.
  #
  # It is the most effective single setting here and the most likely to be wrong:
  # it fails whenever your cluster rules are too narrow. Survivable only because an
  # excluded posting is still counted and one click away - check the excluded list
  # for a week before trusting it.
  require_match: true

# Which labels make a posting UNWORKABLE. Anything not listed here stays a warning
# you can see and overrule - the decision stays yours.
#
# Ids come from rules.yaml, plus the structured ones this file produces:
#   location-excluded, location-conditional, level-too-senior
exclude_if:
  - no-target-track
  - location-excluded
  - level-too-senior
  - language-gate
  - visa-not-sponsored
  - enrolment-required
  - out-of-track-sales

# Not listed above, and therefore only warnings:
#   seniority-threshold  - "5+ years" is often aspirational; worth seeing
#   coding-test-gate     - a preference, not an eligibility rule
#   location-conditional - a UK role may well cover sponsorship; worth seeing
#   location-unknown     - never excluded; an unclear location is shown, not guessed
#   talent-pipeline      - worth submitting to, just not an opening
