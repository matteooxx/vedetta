# Rules are data, not code. Adding a gate means editing this file.
#
# Every rule carries an `explain` string, and that string is what appears in the
# digest next to the posting. If you cannot write a one-line explanation a human
# would accept, the rule is not ready.
#
# `field: title | body | all` picks what a rule reads. Default is `all`. The first
# real run against two live boards labelled a "Senior Backend Engineer" as early
# career, because the word "graduate" sits in nearly every description's boilerplate.
# Level and cluster rules therefore read the title; gates read everything.
#
# `weight:` overrides the severity default for one rule. Use it so that being in a
# target role cluster outweighs merely being at the right level - otherwise an
# "Associate Renewals Manager" ranks alongside a "Cloud Engineer", which the first
# real run did in fact do.
#
# Severity orders postings. It NEVER hides them. Whether a posting is WORKABLE is
# decided separately, in profile.yaml, and even then it is folded behind a visible
# count rather than dropped.

profile:
  # Kept here for the numeric rules below. Your personal constraints live in
  # profile.yaml.
  max_years_experience: 2

rules:
  # ------------------------------------------------------------------- gates
  - id: language-gate
    kind: gate
    severity: blocking
    explain: "requires a language outside your profile"
    # `unless` is the heart of the engine. The difference between a language that is
    # REQUIRED and one that is an ASSET decides whether a posting is dead or alive,
    # and a rule without this clause gets it wrong roughly half the time.
    when:
      - '(?i)\b(fluent|fluency|native|proficien\w+|required|must speak)\b[^.]{0,60}\b(french|german|spanish|dutch|portuguese|polish|swedish|danish|norwegian|finnish|czech|romanian|hungarian|greek|turkish|arabic|hebrew|japanese|mandarin|korean)\b'
      - '(?i)\b(french|german|spanish|dutch|portuguese|polish|swedish|danish|norwegian|finnish|czech|romanian|hungarian|greek|turkish|arabic|hebrew|japanese|mandarin|korean)\b[^.]{0,40}\b(required|mandatory|essential|compulsory|is a must)\b'
    unless:
      - '(?i)\b(french|german|spanish|dutch|portuguese|polish|swedish|danish|norwegian|finnish|czech|romanian|hungarian|greek|turkish|arabic|hebrew|japanese|mandarin|korean)\b[^.]{0,50}\b(asset|a plus|advantage|nice to have|desirable|beneficial|bonus|preferred|appreciated)\b'

  - id: seniority-threshold
    kind: gate
    severity: warning
    explain: "asks for more years than you have:"
    # A number next to the word "years" is not a requirement. Several Cisco adverts
    # came out labelled "asks for more years than you have: 40" - a company founded
    # in 1984 writing "40 years of innovation" into its own boilerplate. The figure
    # used is the largest match, so one stray number outranks the real requirement
    # sitting beside it.
    #
    # Both patterns insist on the word experience, in either order, because adverts
    # state it both ways: "5+ years of experience" and "Experience: 5+ years". One
    # capturing group each, around the number.
    #
    # The gap between the two halves allows no digit and no sentence end. Without
    # that, "a 30 year old company seeking 6 years experience in Python" reached the
    # word experience from the 30 and reported 30 - and because matches do not
    # overlap, it swallowed the 6 that was the real requirement. A rule can be wrong
    # by matching too much as easily as by matching too little.
    field: body
    extract:
      - '(?i)\b(\d{1,2})\s*\+?\s*(?:(?:to|-|–)\s*\d{1,2}\s*)?years?\b(?!\s+old\b)[^.;\n\d]{0,40}?\bexperience\b'
      - '(?i)\bexperience\b[^.;\n\d]{0,25}?\b(\d{1,2})\s*\+?\s*(?:(?:to|-|–)\s*\d{1,2}\s*)?years?\b'
    # Second line of defence, for the next way a pattern turns out to be wrong: no
    # advert asks for more than this, so a larger figure is read as something else on
    # the page and dropped rather than compared.
    compare: { operator: gt, field: max_years_experience, ignore_above: 25 }

  - id: visa-not-sponsored
    kind: gate
    severity: blocking
    explain: "states that sponsorship is not available"
    when:
      - '(?i)(without (visa )?sponsorship|no (visa )?sponsorship|not (able|be able) to sponsor|unable to sponsor|cannot sponsor|do not sponsor|must (already )?have the (right|legal right) to work)'

  - id: enrolment-required
    kind: gate
    severity: blocking
    explain: "requires current university enrolment"
    when:
      - '(?i)(currently enrolled|must be enrolled|returning to (university|school)|pursuing a (bachelor|master)\w*\s*degree)'

  - id: clearance-required
    kind: gate
    severity: blocking
    explain: "requires a security clearance you do not hold"
    when:
      - '(?i)(security clearance|secret clearance|public trust|polygraph|SC cleared|DV cleared)'

  - id: coding-test-gate
    kind: gate
    severity: warning
    explain: "screens with an algorithmic coding test"
    when:
      - '(?i)(coding (challenge|assessment|test|exercise)|technical assessment|hackerrank|codility|leetcode|live coding|whiteboard interview)'

  # --------------------------------------------------------------- pipelines
  - id: talent-pipeline
    kind: pipeline
    severity: info
    explain: "a continuous pipeline, not a current opening"
    when:
      - '(?i)(talent (pool|community|pipeline|network)|no open requirement|speculative application|spontaneous application|general application|join our talent|future opportunit)'

  # ---------------------------------------------------------------- clusters
  # Positive signals: the kinds of work you want. These are the most personal rules
  # in the file - rename, add and delete freely.
  #
  # If profile.yaml sets `tracks.require_match: true`, a posting matching NONE of
  # these is marked unworkable. Being too narrow here therefore hides real work:
  # check the excluded list for a week before trusting that setting.
  - id: cluster-cloud-devops
    field: title
    weight: 5
    kind: cluster
    severity: positive
    explain: "cloud / devops / SRE / platform"
    when:
      - '(?i)\b(cloud|devops|dev ?ops|sre|site reliability|platform|infrastructure|systems?)\s+(engineer|developer|specialist|administrator)\b'
      - '(?i)\b(kubernetes|terraform|observability|reliability)\b'

  - id: cluster-software-engineering
    field: title
    weight: 4
    kind: cluster
    severity: positive
    explain: "software engineering"
    # Added after a first run with `require_match` on cut 341 postings down to one -
    # and that one was a renewals manager. The clusters had no way to express
    # "software engineer", which is squarely in track.
    when:
      - '(?i)\b(software|backend|back.end|frontend|front.end|full.?stack|data|security|network|qa|test)\s+(engineer|developer)\b'
      - '(?i)\b(engineer|developer)\b[^,]{0,24}\b(backend|platform|infrastructure|api|services|tooling)\b'

  - id: cluster-solutions-architecture
    field: title
    weight: 5
    kind: cluster
    severity: positive
    explain: "solutions architecture"
    when:
      - '(?i)\b(solutions?|cloud|enterprise|technical)\s+architect\b'

  - id: cluster-presales
    field: title
    weight: 5
    kind: cluster
    severity: positive
    explain: "technical presales"
    when:
      - '(?i)\b(solutions?|presales|pre-sales|sales|field|partner)\s+engineer\b'
      - '(?i)\b(customer engineer|technical solutions consultant|technical consultant)\b'

  - id: cluster-support-engineering
    field: title
    weight: 3
    kind: cluster
    severity: positive
    explain: "technical support / customer engineering"
    when:
      - '(?i)\b(technical support|support engineer|cloud support|technical account manager|customer success engineer|implementation engineer)\b'

  - id: cluster-ai
    field: title
    weight: 4
    kind: cluster
    severity: positive
    explain: "AI / machine learning engineering"
    when:
      - '(?i)\b(ai|ml|machine learning|genai|applied ai|llm|mlops)\s*(engineer|architect|specialist)\b'

  - id: level-early-career
    field: title
    weight: 1
    kind: note
    severity: positive
    explain: "explicitly early career"
    # `kind: note`, not `cluster`: being the right LEVEL must not satisfy
    # `tracks.require_match`. Being the right kind of work is what that asks about.
    when:
      - '(?i)\b(graduate|new grad|entry[- ]level|early career|apprentice|trainee|intern(ship)?)\b'

  # -------------------------------------------------------------- exclusions
  - id: out-of-track-sales
    field: title
    kind: gate
    severity: blocking
    explain: "a quota-carrying sales role, not a technical one"
    when:
      - '(?i)\b(account executive|account manager|business development|development representative|sales representative|sales manager|territory manager|renewals)\b'
    unless:
      - '(?i)\b(solutions?|sales|presales|technical account)\s+(engineer|architect)\b'
